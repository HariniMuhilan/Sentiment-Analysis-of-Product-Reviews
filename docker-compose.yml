services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    environment:
      # Local research/demo stack; this is not a public production deployment.
      - ENVIRONMENT=development
      # SQLite database path - stored in persistent volume
      - DATABASE_URL=sqlite:////data/sentiment_research.db
      - RATE_LIMIT_PER_MINUTE=120
    volumes:
      # SQLite database volume - persistent storage for research data
      - backend_data:/data
      # This dataset is documented in Datasets/VirtualAssistantDevices/README.md
      # under CC BY 4.0 and is the small, shareable starter corpus.
      - ./Datasets/VirtualAssistantDevices/processed/virtual_assistant_reviews.csv:/seed/virtual_assistant_reviews.csv:ro
    command: >-
      sh -c "python seed_demo_data.py --file /seed/virtual_assistant_reviews.csv
      && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./sentiment-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_data:
    driver: local
