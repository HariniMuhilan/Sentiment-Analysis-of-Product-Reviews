name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests with pytest
        run: |
          cd backend
          pytest -v

      - name: Verify research pipeline & experiment runner
        run: |
          python research/run_experiments.py

  frontend-build:
    name: Frontend Build & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sentiment-dashboard/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd sentiment-dashboard
          npm ci

      - name: Run frontend linter
        run: |
          cd sentiment-dashboard
          npm run lint

      - name: Build frontend for production
        run: |
          cd sentiment-dashboard
          npm run build
